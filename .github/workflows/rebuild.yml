name: 시트 내용으로 사이트 다시 만들기

on:
  schedule:
    - cron: '0 21 * * *'   # 매일 한국 시간 06:00
  workflow_dispatch:        # Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 크롬 준비
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: 기본값 → 시트 합치기 → 페이지 만들기
        run: |
          python3 tools/build_data.py
          python3 tools/sync_sheet.py
          python3 tools/site.py
          python3 tools/prerender.py
      - name: 바뀐 것이 있으면 저장
        run: |
          git config user.name "rebuild-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A assets/data.js index.html about.html activities.html statements.html news.html people.html join.html news record sitemap.xml robots.txt
          if git diff --cached --quiet; then echo "바뀐 것 없음"; else git commit -m "시트 내용 반영: 정적 페이지·사이트맵 재생성" && git push; fi
